apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

patches:
  - path: config-map.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  - target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
    patch: |-
      - op: add
        path: /data/hydrator.enabled
        value: "true"
      - op: add
        path: /data/commit.server
        value: "argocd-commit-server:8086"

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    namespace: argocd
    version: 9.1.0
    releaseName: argocd
    includeCRDs: true

    valuesInline:
      configs:
        params:
          server.insecure: "true"  # must be a string — configs.params lands in a ConfigMap (map[string]string)
          hydrator.enabled: "true"
      commitServer:
        enabled: true

      server:
        service:
          type: ClusterIP
