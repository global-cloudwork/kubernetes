---
# Production Environment Applications for Space Age GitOps
# These applications target the 'live-production' branch for active deployment
# The 'next-production' branch is used for hydrator staging
# NOTE: Production uses manual sync policy for safety

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/global-cloudwork/kubernetes
    targetRevision: live-production
    path: helm/traefik-hydrated
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  revisionHistoryLimit: 3

