traefik:
  installCRDs: true
  deployment:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoExecute
  additionalArguments:
    - --providers.kubernetesgateway
  providers:
    kubernetesGateway:
      enabled: true
  gateway:
    enabled: false
  service:
    type: NodePort
  ports:
    web:
      port: 80
      nodePort: 30080
      expose:
        default: true
      protocol: TCP
    websecure:
      port: 443
      nodePort: 30443
      expose:
        default: true
      protocol: TCP
