---
# Testing (Staging) Environment Applications for Space Age GitOps
# These applications target the 'testing' branch for active deployment
# The 'next-testing' branch is used for hydrator staging

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-testing
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/global-cloudwork/kubernetes
    targetRevision: testing
    path: helm/traefik-hydrated
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  revisionHistoryLimit: 3

