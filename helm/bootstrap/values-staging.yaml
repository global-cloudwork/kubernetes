# Staging environment-specific overrides
# Staging uses persistent cluster and long-lived branches

# Staging uses staging branches
applications:
  hydrator:
    hydrateTargetBranch: "environment/staging-next"
    syncSourceBranch: "environment/staging"

# Larger persistence for staging (always-on, data retained)
argocd:
  persistence:
    enabled: true
    size: 50Gi

# Use provided Authentik secret (persistent across reboots)
authentik:
  generateSecretKey: false
