apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: promoter-webhook-receiver
  namespace: promoter-system
spec:
  rules:
    - host: promoter-webhook.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: promoter-webhook-receiver
                port:
                  number: 3333
