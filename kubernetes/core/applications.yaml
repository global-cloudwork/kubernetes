---
# Unified ApplicationSet - Generates all 42 applications (21 hydrators + 21 environment)
# This single file replaces hydrator-applications.yaml, development.yaml, testing.yaml, prod.yaml
#
# Matrix: 7 apps × 3 envs × 2 types (hydrator + environment) = 42 total applications

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hydrators
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - app: traefik
                - app: argocd
                - app: cert-manager
                - app: authentik
                - app: n8n
                - app: neo4j
                - app: homepage
          - list:
              elements:
                - env: dev
                  branch: development
                  nextBranch: next-development
                - env: testing
                  branch: testing
                  nextBranch: next-testing
                - env: prod
                  branch: live-production
                  nextBranch: next-production
  template:
    metadata:
      name: 'hydrator-{{.app.app}}-{{.env.env}}'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/global-cloudwork/kubernetes
        targetRevision: HEAD
        path: 'applications/{{.app.app}}/charts'
        helm:
          releaseName: '{{.app.app}}'
          valuesFiles:
            - values.yaml
            - 'values-{{.env.env}}.yaml'
      destination:
        server: https://kubernetes.default.svc
      sourceHydrator:
        hydrateTo:
          targetBranch: '{{.env.nextBranch}}'
        syncSource:
          targetBranch: '{{.env.branch}}'
          path: 'applications/{{.app.app}}-hydrated'

---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: environments-auto
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - app: traefik
                - app: argocd
                - app: cert-manager
                - app: authentik
                - app: n8n
                - app: neo4j
                - app: homepage
          - list:
              elements:
                - env: dev
                  branch: development
                  namespace: '{{.app.app}}'
                - env: testing
                  branch: testing
                  namespace: '{{.app.app}}'
  template:
    metadata:
      name: '{{.app.app}}-{{.env.env}}'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/global-cloudwork/kubernetes
        targetRevision: '{{.env.branch}}'
        path: 'applications/{{.app.app}}-hydrated'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.env.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        revisionHistoryLimit: 3

---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: environments-manual
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - app: traefik
                - app: argocd
                - app: cert-manager
                - app: authentik
                - app: n8n
                - app: neo4j
                - app: homepage
          - list:
              elements:
                - env: prod
                  branch: live-production
                  namespace: '{{.app.app}}'
  template:
    metadata:
      name: '{{.app.app}}-{{.env.env}}'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/global-cloudwork/kubernetes
        targetRevision: '{{.env.branch}}'
        path: 'applications/{{.app.app}}-hydrated'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.env.namespace}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        revisionHistoryLimit: 3
