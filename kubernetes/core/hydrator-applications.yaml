---
# Source Hydrator Applications
# These Applications automatically render helm charts from main branch
# to environment branches (next-development, next-testing, next-production)
#
# The hydrator:
# 1. Detects changes to helm charts in main branch
# 2. Renders manifests using helm template
# 3. Commits rendered output to next-* branches
# 4. Environment Applications then sync from the rendered output

# ============================================================================
# DEVELOPMENT ENVIRONMENT HYDRATOR
# ============================================================================

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hydrator-traefik-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/global-cloudwork/kubernetes
    targetRevision: HEAD
    path: helm/traefik
    helm:
      releaseName: traefik
      valuesFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
  sourceHydrator:
    hydrateTo:
      targetBranch: next-development
    syncSource:
      targetBranch: development
      path: helm/traefik-hydrated

