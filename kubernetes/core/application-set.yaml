apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: applications
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - name: traefik
                  namespace: traefik
                  path: applications/traefik
                - name: argocd
                  namespace: argocd
                  path: applications/argocd
                - name: cert-manager
                  namespace: cert-manager
                  path: applications/cert-manager
                - name: authentik
                  namespace: authentik
                  path: applications/authentik
                - name: n8n
                  namespace: n8n
                  path: applications/n8n
                - name: neo4j
                  namespace: neo4j
                  path: applications/neo4j
                - name: homepage
                  namespace: homepage
                  path: applications/homepage
          - list:
              elements:
                - name: development
                  branch: environment/development
                  nextBranch: environment/development-next
                - name: staging
                  branch: environment/staging
                  nextBranch: environment/staging-next
                - name: production
                  branch: environment/production
                  nextBranch: environment/production-next
  template:
    metadata:
      name: '{{.app.name}}-{{.env.name}}'
      namespace: argocd
      labels:
        app.kubernetes.io/managed-by: applicationset
        app-name: '{{.app.name}}'
        environment: '{{.env.name}}'
    spec:
      project: app-project
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.app.namespace}}'
      sourceHydrator:
        drySource:
          repoURL: https://github.com/global-cloudwork/kubernetes
          targetRevision: HEAD
          path: '{{.app.path}}'
        hydrateTo:
          targetBranch: '{{.env.nextBranch}}'
        syncSource:
          targetBranch: '{{.env.branch}}'
          path: '{{.app.path}}'
      syncPolicy:
        automated:
          prune: true
          allowEmpty: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
