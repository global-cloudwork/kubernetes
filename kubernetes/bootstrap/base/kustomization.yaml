apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

# Namespaces and shared resources
resources:
  - namespace.yaml

# Helm chart for ArgoCD
helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    namespace: argocd
    version: 9.1.0
    releaseName: argocd
    includeCRDs: true
    valuesInline:
      global:
        domain: argocd.local
      configs:
        params:
          server.insecure: "true"
      server:
        service:
          type: ClusterIP
        ingress:
          enabled: false

# Patch ArgoCD ConfigMap to enable Source Hydrator
patches:
  - target:
      group: v1
      kind: ConfigMap
      name: argocd-cmd-params-cm
    patch: |-
      - op: add
        path: /data/hydrator.enabled
        value: "true"
      - op: add
        path: /data/commit.server
        value: "argocd-commit-server:8086"

# Generate secrets from environment variables
secretGenerator:
  - name: authentik-secret-key
    namespace: authentik
    envs:
      - authentik-secret.env
    behavior: merge

  - name: global-cloudwork-kubernetes-write
    namespace: argocd
    literals:
      - type=git
      - url=https://github.com/global-cloudwork/kubernetes
    envs:
      - repo-write-secret.env
    behavior: merge

# Add labels to repository secret for ArgoCD
commonLabels:
  kustomize.config.k8s.io/needs-hash: "false"
commonAnnotations: {}
